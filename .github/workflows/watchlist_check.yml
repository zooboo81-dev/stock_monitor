name: Watchlist Check

on:
  # 2026-11-24：定時觸發關掉了，改由家裡電腦的「本機準時跑」（local_runner.py）準時執行。
  # 原因：GitHub 的定時器實測晚 7～12 小時才跑（盤中警示一天只跑 2 次、都在收盤後）。
  # 這裡只留手動：GitHub 網頁 Actions → 選這個工作 → Run workflow（家裡電腦壞掉時的備援）。
  # 要恢復雲端定時：把下面「原設定」每行開頭的「# 」拿掉，並把 data/local_schedule.json 對應項目關掉（不要兩邊同時跑）。
  # ---- 原設定 ----
  # schedule:
  #   # 台灣 14:40 = UTC 06:40（週一至五）
  #   - cron: '40 6 * * 1-5'
  # ----------------
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run watchlist
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: python watchlist_check.py

      - name: Commit notifications
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/notifications.jsonl
          git diff --staged --quiet && echo "無變動" || (git commit -m "chore: watchlist check" && git pull --rebase --autostash && git push)
