name: Margin & Fear Gauge

on:
  # 2026-11-24：定時觸發關掉了，改由家裡電腦的「本機準時跑」（local_runner.py）準時執行。
  # 原因：GitHub 的定時器實測晚 7～12 小時才跑（盤中警示一天只跑 2 次、都在收盤後）。
  # 這裡只留手動：GitHub 網頁 Actions → 選這個工作 → Run workflow（家裡電腦壞掉時的備援）。
  # 要恢復雲端定時：把下面「原設定」每行開頭的「# 」拿掉，並把 data/local_schedule.json 對應項目關掉（不要兩邊同時跑）。
  # ---- 原設定 ----
  # schedule:
  #   # 證交所融資資料約 21:30 後公布
  #   # 台灣 22:20 = UTC 14:20；23:30 = UTC 15:30 補跑（已處理過的日期會自動跳過）
  #   - cron: '20 14 * * 1-5'
  #   - cron: '30 15 * * 1-5'
  # push:
  #   # 程式或排程本身有改 → 推上來就跑一次驗證（已處理過的日期會自動跳過，不會重複推播）
  #   branches: [main]
  #   paths:
  #     - margin_fear_gauge.py
  #     - bottom_scorecard.py
  #     - data/bottom_policy.json
  #     - .github/workflows/margin_fear.yml
  # ----------------
  workflow_dispatch:

concurrency:
  group: margin-fear
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install yfinance requests pandas

      - name: Run gauge
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: python margin_fear_gauge.py

      # 11/20：抄底計分卡（8 項見底條件）。要用到當晚的融資維持率，所以接在融資之後跑；
      # 失敗不擋融資狀態的 commit
      - name: Run bottom scorecard
        continue-on-error: true
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: python bottom_scorecard.py

      - name: Commit state
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/margin_fear_history.json data/margin_fear_state.json data/notifications.jsonl
          git add data/bottom_daily.json data/bottom_scorecard.json || true
          if git diff --staged --quiet; then
            echo "無變動"
          else
            git commit -m "chore: update margin & fear gauge"
            git pull --rebase --autostash
            git push
          fi
